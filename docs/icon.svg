<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Screen State Gradient (On to Off transition) -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Glow Effect for Active Sensor -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Glow for Proximity Waves -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Proximity Sensing Waves (Top Area) -->
  <g opacity="0.85">
    <!-- Outer Wave -->
    <path d="M 176 100 A 110 110 0 0 1 336 100" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.2" />
    <!-- Middle Wave -->
    <path d="M 201 115 A 80 80 0 0 1 311 115" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" opacity="0.5" filter="url(#softGlow)" />
    <!-- Inner Wave -->
    <path d="M 226 130 A 45 45 0 0 1 286 130" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />
  </g>

  <!-- Proximity Trigger Object (Abstract sleek hand/interception wave) -->
  <!-- This represents something coming close to the sensor from the top right -->
  <path d="M 420 60 C 370 70, 310 100, 275 125" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />

  <!-- Smartphone Body Container -->
  <g transform="translate(0, 25)">
    <!-- Outer Chassis -->
    <rect x="156" y="130" width="200" height="310" rx="32" fill="#111420" stroke="#334155" stroke-width="6" />

    <!-- Screen Glass -->
    <rect x="168" y="142" width="176" height="286" rx="22" fill="url(#screenGrad)" />

    <!-- Proximity Sensor Hardware Dot (The Trigger Source) -->
    <circle cx="256" cy="160" r="7" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="256" cy="160" r="3" fill="#ffffff" />

    <!-- Receiver Speaker Slot -->
    <rect x="231" y="147" width="50" height="4" rx="2" fill="#334155" />

    <!-- Screen Shut-Down Action (Diagonal shadow cutting the power) -->
    <path d="M 168 250 L 344 370 L 344 428 L 168 428 Z" fill="#000000" opacity="0.65" />

    <!-- Power Symbol Status (Transitioning to OFF) -->
    <g transform="translate(256, 290)">
      <!-- Outer Ring fading out into the dark section -->
      <path d="M -25 -15 A 30 30 0 1 0 25 -15" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" opacity="0.9" />
      <path d="M 25 -15 A 30 30 0 0 0 -25 -15" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" opacity="0.5" />

      <!-- Power Line (Active & Glowing at the top, cut off at the bottom) -->
      <line x1="0" y1="-32" x2="0" y2="-5" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Sleek Screen Glare / Reflection Matrix -->
    <path d="M 168 142 L 280 142 L 168 254 Z" fill="#ffffff" opacity="0.04" />
  </g>
</svg>
