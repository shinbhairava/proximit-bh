name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture app screenshots
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew --no-daemon assembleDebug

      - name: Capture screenshots
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            mkdir -p screenshots

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.shinbhairava.proximit android.permission.POST_NOTIFICATIONS || true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            adb shell settings put system screen_off_timeout 1800000

            # Keep the QS panel short so the Proximit tile is visible on the first page.
            adb shell cmd statusbar add-tile com.shinbhairava.proximit/.ProximityTileService || true
            adb shell settings put secure sysui_qs_tiles "wifi,cell,flashlight,com.shinbhairava.proximit/.ProximityTileService"
            sleep 2

            # 1. Hidden setup screen with the service stopped.
            adb shell am start -W -n com.shinbhairava.proximit/.SetupActivity
            sleep 2
            adb exec-out screencap -p > screenshots/setup.png

            # Start the screen-off service through the tile.
            adb shell cmd statusbar click-tile com.shinbhairava.proximit/.ProximityTileService || true
            sleep 3

            # 2. Quick Settings panel with the active tile.
            adb shell cmd statusbar expand-settings
            sleep 2
            adb exec-out screencap -p > screenshots/quick-settings.png

            # 3. Ongoing foreground-service notification.
            adb shell cmd statusbar collapse
            sleep 1
            adb shell cmd statusbar expand-notifications
            sleep 2
            adb exec-out screencap -p > screenshots/notification.png
            adb shell cmd statusbar collapse || true

            # 4. Setup screen while the service is running.
            adb shell am start -W -n com.shinbhairava.proximit/.SetupActivity
            sleep 2
            adb exec-out screencap -p > screenshots/setup-running.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: proximit-screenshots
          path: screenshots/*.png
          if-no-files-found: error
