name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Keeps the debug signing key stable across runs so newer APKs can be
      # installed over older ones without uninstalling first.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: proximit-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The Gradle wrapper JAR is a binary, so it is generated in CI instead of
      # being committed. This keeps the repository text-only.
      - name: Generate Gradle wrapper and build APK
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: proximit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: proximit-debug-apk
          path: dist

      - name: Rename APK for release
        run: |
          mkdir -p release
          for apk in dist/*.apk; do
            cp "$apk" "release/Proximit-${GITHUB_REF_NAME}.apk"
          done
          ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
